<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="50%" y="20%" dominant-baseline="middle" text-anchor="middle" font-size="20" fill="#111">Kolkata Healthcare Data Platform</text>
  <rect x="50" y="60" width="200" height="60" rx="8" fill="#e8f3ff" stroke="#80bfff"/>
  <text x="150" y="95" dominant-baseline="middle" text-anchor="middle" font-size="14">Bronze (Raw)</text>
  <rect x="300" y="60" width="200" height="60" rx="8" fill="#f3fff0" stroke="#8fd68f"/>
  <text x="400" y="95" dominant-baseline="middle" text-anchor="middle" font-size="14">Silver (Flattened)</text>
  <rect x="550" y="60" width="200" height="60" rx="8" fill="#fff7e8" stroke="#ffcf80"/>
  <text x="650" y="95" dominant-baseline="middle" text-anchor="middle" font-size="14">Gold (Star Schema)</text>
  <line x1="250" y1="90" x2="300" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="90" x2="550" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444" />
    </marker>
  </defs>
</svg>